spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/Amazon}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
resilience4j.ratelimiter.instances.customerOrder.limitForPeriod=3
resilience4j.ratelimiter.instances.customerOrder.limitRefreshPeriod=1m
resilience4j.ratelimiter.instances.customerOrder.timeoutDuration=0
resilience4j.circuitbreaker.instances.customerDatabase.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.customerDatabase.slidingWindowSize=10
resilience4j.circuitbreaker.instances.customerDatabase.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.customerDatabase.failureRateThreshold=50
resilience4j.circuitbreaker.instances.customerDatabase.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.customerDatabase.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.customerDatabase.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.customerDatabase.recordExceptions[0]=org.springframework.dao.DataAccessException